name: Release

on:
  push:
    tags:
      - "[0-9]*.*"
      - "v[0-9]*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  release-linux-musl:
    name: Build static musl binary & .deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools and cargo-deb
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo install cargo-deb --locked

      - name: Build static x86_64-unknown-linux-musl binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p btrw
          file target/x86_64-unknown-linux-musl/release/btrw
          ls -lh target/x86_64-unknown-linux-musl/release/btrw

      - name: Package tarball and .deb
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist
          tar -C target/x86_64-unknown-linux-musl/release -czf "dist/btrw-${TAG}-x86_64-linux-musl.tar.gz" btrw
          cargo deb --no-build --target x86_64-unknown-linux-musl -p btrw --output "dist/btrw_${TAG}_amd64.deb"
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/btrw-*.tar.gz
            dist/btrw_*_amd64.deb
            dist/SHA256SUMS
