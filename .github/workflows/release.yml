name: Release

on:
  push:
    tags:
      - "[0-9]*.*"
      - "v[0-9]*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  release-linux-musl:
    name: Build static musl binary & .deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static x86_64-unknown-linux-musl binary
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl -p btrw
          file target/x86_64-unknown-linux-musl/release/btrw
          ls -lh target/x86_64-unknown-linux-musl/release/btrw

      - name: Package tarball and universal .deb (xz)
        run: |
          TAG="${GITHUB_REF_NAME}"
          DEB_VER="${TAG#v}"
          BIN="target/x86_64-unknown-linux-musl/release/btrw"
          mkdir -p dist

          tar -C target/x86_64-unknown-linux-musl/release -czf "dist/btrw-${TAG}-x86_64-linux-musl.tar.gz" btrw

          STAGE="target/deb-stage"
          rm -rf "${STAGE}"
          mkdir -p "${STAGE}/DEBIAN" "${STAGE}/usr/bin" "${STAGE}/usr/share/doc/btrw"
          install -m 0755 "${BIN}" "${STAGE}/usr/bin/btrw"
          install -m 0644 README.md "${STAGE}/usr/share/doc/btrw/README.md"
          install -m 0644 LICENSE "${STAGE}/usr/share/doc/btrw/copyright"

          INSTALLED_KB=$(du -sk "${STAGE}/usr" | awk '{print $1}')
          cat > "${STAGE}/DEBIAN/control" <<EOF
          Package: btrw
          Version: ${DEB_VER}
          Section: utils
          Priority: optional
          Architecture: amd64
          Installed-Size: ${INSTALLED_KB}
          Recommends: btrfs-progs
          Maintainer: Btrfs Rewind Contributors <czmiho@users.noreply.github.com>
          Homepage: https://github.com/czmiho/btrw
          Description: Btrfs Rewind — dual-pane Btrfs snapshot & time-travel TUI
           Btrfs Rewind (btrw) is a Midnight Commander-style dual-pane terminal UI
           for browsing, comparing, time-traveling through, and safely restoring files
           from Btrfs snapshots (btrbk, snapper, timeshift, manual) or plain directories.
          EOF

          dpkg-deb -Zxz --build --root-owner-group "${STAGE}" "dist/btrw_${TAG}_amd64.deb"
          dpkg-deb --info "dist/btrw_${TAG}_amd64.deb"
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/btrw-*.tar.gz
            dist/btrw_*_amd64.deb
            dist/SHA256SUMS
